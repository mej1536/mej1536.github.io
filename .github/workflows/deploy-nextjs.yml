name: Deploy Next.js site to GitHub Pages

on:
  push:
    # 깃허브 기본 브랜치를 'blog-nextjs'로 변경하셨으므로 해당 브랜치를 타겟으로 지정합니다.
    branches: ["blog-nextjs"]
    # 아래 설정(paths)을 추가하면, 지정된 폴더나 파일이 수정되었을 때만 자동 배포가 실행됩니다.
    paths:
      - "blog/posts/**" # 마크다운 글이 보관되는 폴더에 변화가 있을 때만 작동합니다.
  # 수동으로 깃허브 액션을 실행할 수 있도록 하는 옵션입니다.
  workflow_dispatch:

# 깃허브 페이지 배포를 위해 필요한 권한 설정입니다.
permissions:
  contents: read
  pages: write
  id-token: write

# 여러 번 푸시가 발생했을 때 이전 배포를 취소하고 최신 배포만 진행하도록 하는 설정입니다.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # 현재 Next.js 프로젝트가 'blog' 폴더 안에 있으므로 작업 디렉토리를 지정합니다.
        working-directory: ./blog
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: ./blog/pnpm-lock.yaml

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          static_site_generator: next

      - name: Install dependencies
        run: pnpm install

      - name: Build with Next.js
        run: pnpm next build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # pnpm next build 명령어가 만들어낸 정적 파일들이 모인 폴더의 경로입니다.
          path: ./blog/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
