<html lang="{{ page.lang | default: site.lang | default: 'en-US' }}" class="no-js">
  {% include head.html %}

  <body>
    <div class="ui-wrapper layout--{{ page.layout | default: layout.layout }}{% if page.classes or layout.classes %}{{ page.classes | default: layout.classes | join: ' ' | prepend: ' ' }}{% endif %} {% if page.entries_layout == 'grid' %}page--wide{% endif %} {{ page.title | slugify }}">

      <header class="masthead">
        <div class="wrap">여기는 페이지 제목이 들어감</div>
      </header>

      {{ content }}

      {% include footer-exception.html %}

    </div>
  </body>

</html>
