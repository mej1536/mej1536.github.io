allowBuilds:
  "@parcel/watcher": false
  sharp: false
  unrs-resolver: false
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
overrides:
  postcss: ^8.5.5
  source-map-js: ^1.2.2
  "minimatch@3>brace-expansion": ^1.1.21
  "minimatch@10": ^11.0.1
  "minimatch@11>brace-expansion": ^5.0.12
  zod: ^4.6.6
  "gray-matter>js-yaml": 3.15.2
  "@eslint/eslintrc>js-yaml": ^4.3.2
  "@babel/core": 7.29.7
  sharp: ^0.35.5
auditConfig:
  ignoreGhsas:
    # minimatch@3에는 취약 코드(firstPhasePreProcess)가 없고 패치 버전도 없음
    - GHSA-g3hv-75wg-m249
minimumReleaseAgeExclude:
  - '@next/eslint-plugin-next@16.4.4'
  - eslint-config-next@16.4.4
